    <text x="850" y="498" fill="#7e94ae" font-size="12">VERSION</text><text x="850" y="524" fill="#e4eef9" font-size="15">0.6.6</text>
    <text x="352" y="570" fill="#7e94ae" font-size="12">BUILD</text><text x="352" y="596" fill="#e4eef9" font-size="15">606</text>
    <text x="600" y="570" fill="#7e94ae" font-size="12">MINIMUM IOS</text><text x="600" y="596" fill="#e4eef9" font-size="15">17.0</text>
    <text x="850" y="570" fill="#7e94ae" font-size="12">SIGNATURE INDICATORS</text><text x="850" y="596" fill="#e7c98d" font-size="15">Files detected · Not verified</text>
  </g>
  <rect x="1107" y="418" width="421" height="214" rx="16" fill="url(#card)" stroke="#2b4762"/>
  <text x="1133" y="457" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Assisted installation</text>
  <text x="1133" y="491" fill="#8da2bb" font-family="Inter,Arial,sans-serif" font-size="12">Hand off the original package to a compatible installer.</text>
  <rect x="1133" y="512" width="367" height="44" rx="9" fill="#173b5d" stroke="#3b6b97"/><text x="1170" y="540" fill="#c5e2ff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Send IPA to installer</text>
  <rect x="1133" y="568" width="367" height="42" rx="9" fill="#142337" stroke="#304964"/><text x="1170" y="594" fill="#b9dafa" font-family="Inter,Arial,sans-serif" font-size="12">SideStore · HTTPS manifest</text>
  <rect x="326" y="656" width="1202" height="270" rx="16" fill="url(#card)" stroke="#283c54"/>
  <text x="352" y="696" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Archive structure</text>
  <text x="1450" y="696" fill="#7fa6cb" font-family="Inter,Arial,sans-serif" font-size="13">128 entries</text>
  <g font-family="monospace" font-size="14">
    <text x="354" y="742" fill="#9dcfff">▾ Payload/</text><text x="390" y="780" fill="#b6c7d9">▾ Nuvio.app/</text>
    <text x="430" y="818" fill="#d5e1ee">Info.plist</text><text x="430" y="852" fill="#d5e1ee">Nuvio</text><text x="430" y="886" fill="#d5e1ee">Assets.car</text>
    <text x="850" y="742" fill="#8b9fb6">_CodeSignature/CodeResources</text><text x="850" y="780" fill="#8b9fb6">Frameworks/</text><text x="850" y="818" fill="#8b9fb6">embedded.mobileprovision</text>
  </g>
  <rect x="326" y="911" width="1202" height="5" rx="3" fill="#1c2b3e"/><rect x="326" y="911" width="1202" height="5" rx="3" fill="#5daeff"/>
</svg>