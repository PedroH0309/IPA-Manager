name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation and ZIP engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check zip-engine.js
          node --check download-engine.js
          node --check signature-engine.js
          node --check provisioning-engine.js
          node --check feature-flags.js
      - name: Run ZIP engine tests
        run: node --test tests/*.test.cjs
      - name: Validate PWA manifest
        run: python -m json.tool manifest.webmanifest > /dev/null
      - name: Check required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f zip-engine.js
          test -f download-engine.js
          test -f signature-engine.js
          test -f provisioning-engine.js
          test -f feature-flags.js
          test -f LICENSE
          test -f tests/download-engine.test.cjs
          test -f tests/signature-engine.test.cjs
          test -f tests/provisioning-engine.test.cjs
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/APPLE_DISTRIBUTION.md
