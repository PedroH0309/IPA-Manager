name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate PWA manifest
        run: python -m json.tool manifest.webmanifest > /dev/null
      - name: Check required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f LICENSE
          test -f README.md
