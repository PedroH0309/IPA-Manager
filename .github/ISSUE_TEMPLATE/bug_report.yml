name: Bug report
description: Report a reproducible problem in IPA Manager.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload private IPA files, Apple credentials, provisioning profiles, certificates, or device identifiers.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Tap...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 18.x, Chrome 130, etc.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: iOS 18.x, Windows 11, macOS, etc.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or console output
      description: Remove personal information before posting.
    validations:
      required: false
